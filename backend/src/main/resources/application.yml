spring:
  application:
    name: book-store-backend

  # ── Active Profile ─────────────────────────────────────────────────────────
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BookStoreHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────
  # Provide MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD to enable email.
  # For local dev: use Mailtrap (https://mailtrap.io) credentials.
  # For Gmail: use an App Password (not your account password).
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Jackson ───────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── Springdoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ── Application-level properties ──────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:ThisIsADefaultDevSecretKeyThatMustBeChangedInProduction!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}    # 24 hours
  delivery:
    offset-days: ${DELIVERY_OFFSET_DAYS:7}           # Estimated delivery = today + N days
  tax:
    rate: ${TAX_RATE:0.12}                           # 12% GST
  password-reset:
    token-expiry-seconds: ${RESET_TOKEN_EXPIRY:900}  # 15 minutes

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.bookstore: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
